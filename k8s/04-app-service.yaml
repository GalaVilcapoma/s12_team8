# ==============================================================================
# Service: mongo-service (ClusterIP interno)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: practica-s12
  labels:
    app: mongo
    app.kubernetes.io/name: mongo-service
    app.kubernetes.io/part-of: practica-s12
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
---
# ==============================================================================
# Service: app-service (NodePort externo - Puerto 30080)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: practica-s12
  labels:
    app: app
    app.kubernetes.io/name: app-service
    app.kubernetes.io/part-of: practica-s12
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
